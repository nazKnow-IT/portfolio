<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Cover artwork for the e-commerce platform: a storefront awning with a price tag">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a3a"/><stop offset="1" stop-color="#121923"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg3)"/>
  <g opacity=".14" stroke="#9fb3d1" stroke-width="2" fill="none">
    <circle cx="1320" cy="180" r="150"/><circle cx="1320" cy="180" r="230"/>
  </g>
  <!-- awning -->
  <g transform="translate(160 170)">
    <rect x="0" y="120" width="700" height="420" rx="14" fill="#18222f" stroke="#41547a" stroke-width="3"/>
    <g>
      <path d="M0 120h700l-40 96H40z" fill="#2b3a52"/>
      <path d="M40 216h120l-30 60zM200 216h120l-30 60zM360 216h120l-30 60zM520 216h120l-30 60z" fill="#b4530d" opacity=".85"/>
    </g>
    <g fill="#0f1620" stroke="#41547a" stroke-width="2">
      <rect x="60" y="320" width="180" height="190" rx="8"/>
      <rect x="260" y="320" width="180" height="190" rx="8"/>
      <rect x="460" y="320" width="180" height="190" rx="8"/>
    </g>
    <g fill="#5b7096" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">
      <text x="150" y="420">jersey</text><text x="350" y="420">sticker</text><text x="550" y="420">card</text>
    </g>
    <g fill="#f59e0b"><rect x="80" y="450" width="60" height="8" rx="4"/><rect x="280" y="450" width="60" height="8" rx="4"/><rect x="480" y="450" width="60" height="8" rx="4"/></g>
  </g>
  <!-- price tag -->
  <g transform="translate(930 300) rotate(-8)">
    <path d="M0 60L160 0l280 104-14 250L180 400 0 260z" fill="#fdf0e0" stroke="#b4530d" stroke-width="4"/>
    <circle cx="150" cy="90" r="22" fill="#1f2a3a"/>
    <g fill="#151a22" font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <text x="60" y="190" font-size="34" font-weight="700">RM</text>
      <text x="130" y="196" font-size="58" font-weight="700">=</text>
    </g>
    <g stroke="#b4530d" stroke-width="6" stroke-linecap="round">
      <path d="M60 250h230"/><path d="M60 290h170"/><path d="M60 330h210"/>
    </g>
    <text x="300" y="150" font-family="IBM Plex Mono, Consolas, monospace" font-size="22" fill="#8a3d05">fabric</text>
    <text x="300" y="196" font-family="IBM Plex Mono, Consolas, monospace" font-size="22" fill="#8a3d05">size run</text>
    <text x="300" y="242" font-family="IBM Plex Mono, Consolas, monospace" font-size="22" fill="#8a3d05">qty</text>
  </g>
  <path d="M160 720h700" stroke="#41547a" stroke-width="2"/>
  <text x="160" y="770" font-family="IBM Plex Mono, Consolas, monospace" font-size="26" fill="#8fa5c6" letter-spacing="4">CART → PAYMENT → PRODUCTION QUEUE</text>
</svg>
