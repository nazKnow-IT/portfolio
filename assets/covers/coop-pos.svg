<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Cover artwork for the POS system: a receipt with a barcode and stock grid">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f7"/><stop offset="1" stop-color="#dbe3ee"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <g stroke="#c3ccd9" stroke-width="1">
    <path d="M0 225h1600M0 450h1600M0 675h1600"/><path d="M400 0v900M800 0v900M1200 0v900"/>
  </g>
  <!-- dashboard panel -->
  <g transform="translate(120 150)">
    <rect width="620" height="600" rx="18" fill="#2b3a52"/>
    <rect x="28" y="34" width="240" height="16" rx="8" fill="#5b7096"/>
    <g fill="#3d5175">
      <rect x="28" y="86" width="564" height="60" rx="8"/>
      <rect x="28" y="158" width="564" height="60" rx="8"/>
      <rect x="28" y="230" width="564" height="60" rx="8"/>
      <rect x="28" y="302" width="564" height="60" rx="8"/>
    </g>
    <g fill="#9fb3d1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">
