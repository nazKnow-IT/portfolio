      <text x="48" y="270">sale_line</text><text x="48" y="342">supplier</text>
    </g>
    <g fill="#f59e0b"><circle cx="556" cy="116" r="9"/><circle cx="556" cy="260" r="9"/></g>
    <g fill="#4b6b13"><circle cx="556" cy="188" r="9"/><circle cx="556" cy="332" r="9"/></g>
    <rect x="28" y="392" width="564" height="176" rx="10" fill="#1f2b3e"/>
    <polyline points="48,540 130,500 210,516 290,452 370,470 450,412 530,430 572,398"
