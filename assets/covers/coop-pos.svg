  </g>
  <!-- receipt -->
  <g transform="translate(860 110)">
    <path d="M0 0h520v640l-32 24-33-24-32 24-33-24-32 24-33-24-32 24-33-24-32 24-33-24-32 24-33-24-32 24V0z" fill="#fff" stroke="#c3ccd9" stroke-width="2"/>
    <g fill="#151a22" font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <text x="40" y="66" font-size="30" font-weight="700" letter-spacing="2">COOP STORE</text>
      <text x="40" y="100" font-size="18" fill="#77828f">UTHM Pagoh · cashier terminal</text>
    </g>
    <rect x="40" y="128" width="440" height="2" fill="#dde3ec"/>
