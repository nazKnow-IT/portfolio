    <g fill="#151a22" transform="translate(40 156)">
      <rect width="6" height="96"/><rect x="12" width="3" height="96"/><rect x="20" width="9" height="96"/>
      <rect x="34" width="3" height="96"/><rect x="42" width="6" height="96"/><rect x="56" width="3" height="96"/>
      <rect x="64" width="12" height="96"/><rect x="84" width="3" height="96"/><rect x="92" width="7" height="96"/>
      <rect x="106" width="3" height="96"/><rect x="116" width="10" height="96"/><rect x="134" width="4" height="96"/>
      <rect x="146" width="6" height="96"/><rect x="160" width="3" height="96"/><rect x="170" width="11" height="96"/>
      <rect x="190" width="4" height="96"/><rect x="202" width="6" height="96"/><rect x="216" width="3" height="96"/>
      <rect x="226" width="9" height="96"/><rect x="244" width="4" height="96"/><rect x="256" width="6" height="96"/>
      <rect x="270" width="3" height="96"/><rect x="280" width="12" height="96"/><rect x="302" width="4" height="96"/>
      <rect x="314" width="6" height="96"/><rect x="328" width="3" height="96"/><rect x="338" width="10" height="96"/>
      <rect x="358" width="4" height="96"/><rect x="370" width="6" height="96"/><rect x="384" width="3" height="96"/>
      <rect x="394" width="11" height="96"/><rect x="414" width="4" height="96"/><rect x="426" width="7" height="96"/>
    </g>
    <g fill="#495464" font-family="IBM Plex Mono, Consolas, monospace" font-size="19">
      <text x="40" y="300">rice 5kg          2   11.60</text>
      <text x="40" y="334">detergent         1    8.90</text>
      <text x="40" y="368">notebook a4       4   14.00</text>
      <text x="40" y="402">instant coffee    2    9.80</text>
    </g>
    <rect x="40" y="424" width="440" height="2" fill="#dde3ec"/>
    <text x="40" y="466" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#151a22">TOTAL 44.30</text>
    <text x="40" y="500" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#b4530d">stock decremented in the same transaction</text>
  </g>
