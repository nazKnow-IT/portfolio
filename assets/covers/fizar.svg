    <rect x="26" y="40" width="240" height="26" rx="13" fill="#f59e0b"/>
    <rect x="26" y="90" width="330" height="14" rx="7" fill="#5b7096"/>
    <rect x="26" y="120" width="290" height="14" rx="7" fill="#5b7096"/>
    <rect x="26" y="180" width="368" height="230" rx="6" fill="#1f2b3e"/>
    <g stroke="#fbbf24" stroke-width="4" fill="none">
      <path d="M60 360 L150 250 L230 320 L330 210"/>
    </g>
    <g fill="#fbbf24"><circle cx="150" cy="250" r="7"/><circle cx="230" cy="320" r="7"/><circle cx="330" cy="210" r="7"/></g>
    <g fill="#8fa5c6"><rect x="26" y="440" width="150" height="12" rx="6"/><rect x="26" y="470" width="220" height="12" rx="6"/></g>
    <g stroke="#9fb3d1" stroke-width="3"><path d="M0 0v-40M420 0v-40"/></g>
  </g>
  <!-- vector pen path motif -->
