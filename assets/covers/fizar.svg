<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Cover artwork for the Fizar Enterprise site: an apparel shape, a banner and vector pen paths">
  <defs>
    <linearGradient id="bg4" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f7f3ee"/><stop offset="1" stop-color="#e6ecf5"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg4)"/>
  <g stroke="#c3ccd9" stroke-width="1.5" fill="none" opacity=".7">
    <path d="M0 300h1600M0 600h1600"/><path d="M533 0v900M1066 0v900"/>
  </g>
  <!-- tee shirt -->
  <g transform="translate(180 210)">
