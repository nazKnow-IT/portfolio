    <g fill="#b4530d"><circle cx="240" cy="250" r="8"/><rect x="180" y="286" width="120" height="10" rx="5"/><rect x="200" y="312" width="80" height="10" rx="5"/></g>
  </g>
  <!-- banner -->
  <g transform="translate(700 150)">
