<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Cover artwork for the playable portfolio: an isometric island with seven glowing checkpoints">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101823"/><stop offset="1" stop-color="#243247"/>
    </linearGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg5)"/>
  <!-- isometric ground -->
  <g transform="translate(800 520)">
    <ellipse cx="0" cy="0" rx="620" ry="290" fill="#18222f" stroke="#41547a" stroke-width="3"/>
    <g stroke="#2b3a52" stroke-width="2">
      <ellipse rx="500" ry="234" fill="none"/><ellipse rx="380" ry="178" fill="none"/><ellipse rx="250" ry="117" fill="none"/>
      <path d="M-620 0h1240M0 -290v580"/>
      <path d="M-440 -205 880 415M440 -205-880 415" fill="none"/>
    </g>
  </g>
  <!-- route -->
  <path d="M300 560 C420 470 520 620 660 540 S900 400 1010 470 1240 520 1330 400"
        fill="none" stroke="#5b7096" stroke-width="4" stroke-dasharray="14 12"/>
  <!-- beacons -->
  <g>
    <g transform="translate(300 560)"><ellipse rx="70" ry="34" fill="url(#pool)"/><rect x="-5" y="-120" width="10" height="120" fill="#f59e0b"/><circle cy="-132" r="16" fill="#fbbf24"/></g>
    <g transform="translate(520 500)"><ellipse rx="70" ry="34" fill="url(#pool)"/><rect x="-4" y="-96" width="8" height="96" fill="#b4530d"/><circle cy="-106" r="13" fill="#f59e0b"/></g>
    <g transform="translate(690 552)"><ellipse rx="70" ry="34" fill="url(#pool)"/><rect x="-4" y="-104" width="8" height="104" fill="#b4530d"/><circle cy="-114" r="13" fill="#f59e0b"/></g>
    <g transform="translate(880 452)"><ellipse rx="76" ry="36" fill="url(#pool)"/><rect x="-6" y="-146" width="12" height="146" fill="#f59e0b"/><circle cy="-160" r="19" fill="#fde68a"/></g>
    <g transform="translate(1050 486)"><ellipse rx="70" ry="34" fill="url(#pool)"/><rect x="-4" y="-96" width="8" height="96" fill="#b4530d"/><circle cy="-106" r="13" fill="#f59e0b"/></g>
    <g transform="translate(1220 470)"><ellipse rx="70" ry="34" fill="url(#pool)"/><rect x="-4" y="-108" width="8" height="108" fill="#b4530d"/><circle cy="-118" r="13" fill="#f59e0b"/></g>
    <g transform="translate(1340 404)"><ellipse rx="70" ry="34" fill="url(#pool)"/><rect x="-4" y="-92" width="8" height="92" fill="#b4530d"/><circle cy="-102" r="13" fill="#f59e0b"/></g>
  </g>
  <!-- character -->
  <g transform="translate(430 520)" fill="#dbe3ee">
    <rect x="-16" y="-58" width="32" height="40" rx="6"/>
    <circle cx="0" cy="-72" r="15"/>
    <rect x="-18" y="-18" width="12" height="26" rx="4"/><rect x="6" y="-18" width="12" height="26" rx="4"/>
    <ellipse cy="14" rx="34" ry="9" fill="#0d1319" opacity=".55"/>
  </g>
  <g font-family="IBM Plex Mono, Consolas, monospace" font-size="22" fill="#8fa5c6" letter-spacing="4">
    <text x="120" y="150">7 CHECKPOINTS</text>
    <text x="120" y="184">110 XP / LEVEL</text>
    <text x="1120" y="800">three.js · WEBGL · NO BUILD STEP</text>
  </g>
  <rect x="120" y="200" width="180" height="3" fill="#f59e0b"/>
