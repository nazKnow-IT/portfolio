<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Cover artwork for the BIM dataset: normalised keypoint clouds arranged in a grid">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a1f"/><stop offset="1" stop-color="#1a2c33"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg6)"/>
  <g stroke="#24424d" stroke-width="1.5">
    <path d="M0 180h1600M0 360h1600M0 540h1600M0 720h1600"/>
    <path d="M320 0v900M640 0v900M960 0v900M1280 0v900"/>
  </g>
  <!-- keypoint clouds, one per cell -->
  <g id="cloud">
    <g fill="#7dd3fc">
      <circle cx="0" cy="0" r="5"/><circle cx="-26" cy="-40" r="4"/><circle cx="24" cy="-44" r="4"/>
      <circle cx="-46" cy="-14" r="4"/><circle cx="44" cy="-18" r="4"/>
    </g>
    <g fill="#f59e0b">
      <circle cx="-60" cy="40" r="5"/><circle cx="-40" cy="70" r="4"/><circle cx="-18" cy="92" r="4"/>
      <circle cx="58" cy="44" r="5"/><circle cx="42" cy="76" r="4"/><circle cx="20" cy="96" r="4"/>
    </g>
    <g stroke="#3d6472" stroke-width="2" fill="none">
      <path d="M0 0-26-40M0 0 24-44M0 0-46-14M0 0 44-18M0 0-60 40M0 0 58 44"/>
      <path d="M-60 40-40 70-18 92M58 44 42 76 20 96"/>
    </g>
  </g>
  <use href="#cloud" x="320" y="270"/><use href="#cloud" x="640" y="270"/>
  <use href="#cloud" x="960" y="270"/><use href="#cloud" x="1280" y="270"/>
  <use href="#cloud" x="320" y="630"/><use href="#cloud" x="960" y="630"/>
  <use href="#cloud" x="1280" y="630"/>
  <!-- centring diagram in the middle cell -->
  <g transform="translate(640 630)">
    <circle r="86" fill="none" stroke="#b4530d" stroke-width="3" stroke-dasharray="10 8"/>
    <circle r="7" fill="#fbbf24"/>
    <path d="M0 0H72" stroke="#f59e0b" stroke-width="3"/>
    <text x="16" y="-12" font-family="IBM Plex Mono, Consolas, monospace" font-size="20" fill="#f59e0b">scale</text>
    <text x="-84" y="126" font-family="IBM Plex Mono, Consolas, monospace" font-size="19" fill="#8fa5c6">mid = (shL+shR)/2</text>
  </g>
  <g font-family="IBM Plex Mono, Consolas, monospace" fill="#8fa5c6" letter-spacing="4">
    <text x="120" y="120" font-size="24">117 CLASSES · 15,258 SEQUENCES</text>
    <text x="120" y="820" font-size="22">1,662 KEYPOINTS / FRAME → .npy</text>
  </g>
  <rect x="120" y="136" width="420" height="3" fill="#f59e0b"/>
</svg>
