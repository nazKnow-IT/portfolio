<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Cover artwork for MyDompet: a scanned receipt beside a phone showing a spending chart and goal bar">
  <defs>
    <linearGradient id="mdbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0fa"/><stop offset="1" stop-color="#e3dcf0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#mdbg)"/>
  <g stroke="#d3cae3" stroke-width="1">
    <path d="M0 225h1600M0 450h1600M0 675h1600"/><path d="M400 0v900M800 0v900M1200 0v900"/>
  </g>
  <!-- receipt -->
  <g transform="translate(170 120) rotate(-4)">
    <path d="M0 0h440v600l-31 22-31-22-31 22-31-22-31 22-31-22-31 22-31-22-31 22-31-22-31 22-31-22-31 22-31-22V0z" fill="#fff" stroke="#d3cae3" stroke-width="2"/>
    <g font-family="Consolas, Menlo, monospace" fill="#2a2338">
      <text x="40" y="70" font-size="30" font-weight="700">KEDAI KOPI</text>
      <text x="40" y="108" font-size="20" fill="#8a8299">12/11/2026  13:42</text>
      <text x="40" y="180" font-size="22">Nasi lemak</text><text x="300" y="180" font-size="22">7.50</text>
      <text x="40" y="224" font-size="22">Kopi O ais</text><text x="300" y="224" font-size="22">3.20</text>
      <text x="40" y="268" font-size="22">Roti bakar</text><text x="300" y="268" font-size="22">4.00</text>
      <text x="40" y="360" font-size="26" font-weight="700">TOTAL</text><text x="270" y="360" font-size="26" font-weight="700">RM14.70</text>
    </g>
    <rect x="40" y="300" width="360" height="2" fill="#e4deee"/>
    <!-- scan highlight -->
    <rect x="24" y="44" width="392" height="80" rx="10" fill="none" stroke="#7c5cd6" stroke-width="4"/>
    <rect x="24" y="326" width="392" height="50" rx="10" fill="#7c5cd6" opacity=".14" stroke="#7c5cd6" stroke-width="4"/>
    <rect x="0" y="430" width="440" height="6" fill="#7c5cd6" opacity=".55"/>
  </g>
  <!-- arrow -->
  <path d="M690 450h150" stroke="#7c5cd6" stroke-width="8" stroke-linecap="round"/>
  <path d="M820 422l30 28-30 28" fill="none" stroke="#7c5cd6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- phone -->
  <g transform="translate(920 90)">
    <rect width="420" height="720" rx="48" fill="#2a2338"/>
    <rect x="20" y="20" width="380" height="680" rx="32" fill="#faf8fd"/>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <text x="50" y="92" font-size="20" fill="#8a8299">This month</text>
      <text x="50" y="146" font-size="46" font-weight="700" fill="#2a2338">RM 642.10</text>
      <text x="50" y="186" font-size="18" fill="#8a8299">spent of RM 900 limit</text>
    </g>
    <rect x="50" y="206" width="320" height="16" rx="8" fill="#e8e1f4"/>
    <rect x="50" y="206" width="228" height="16" rx="8" fill="#7c5cd6"/>
    <!-- chart -->
    <rect x="50" y="252" width="320" height="200" rx="16" fill="#fff" stroke="#e8e1f4" stroke-width="2"/>
    <polyline points="70,420 110,400 150,410 190,360 230,380 270,320 310,340 350,290" fill="none" stroke="#7c5cd6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#7c5cd6"><circle cx="270" cy="320" r="7"/><circle cx="350" cy="290" r="7"/></g>
    <!-- transactions -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20">
      <rect x="50" y="478" width="320" height="64" rx="14" fill="#fff" stroke="#e8e1f4" stroke-width="2"/>
      <circle cx="84" cy="510" r="16" fill="#f6d9b8"/><text x="112" y="517" fill="#2a2338">Food &amp; drink</text><text x="290" y="517" fill="#2a2338">14.70</text>
      <rect x="50" y="556" width="320" height="64" rx="14" fill="#fff" stroke="#e8e1f4" stroke-width="2"/>
      <circle cx="84" cy="588" r="16" fill="#c9e3d6"/><text x="112" y="595" fill="#2a2338">Transport</text><text x="290" y="595" fill="#2a2338">6.00</text>
    </g>
    <rect x="160" y="650" width="100" height="10" rx="5" fill="#d3cae3"/>
  </g>
</svg>
